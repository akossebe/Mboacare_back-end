server.port = 8081

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/mboacare_bd
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# ==========================================
# CONFIGURATION EMAIL (SMTP)
# ==========================================
# Remplace avec ton email Gmail et le "mot de passe d'application" (16 caractères générés par Google)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=mboacare@gmail.com
spring.mail.password=admin_123
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Augmenter la taille maximale pour les requêtes POST (Images Base64)
server.tomcat.max-http-form-post-size=20MB
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
